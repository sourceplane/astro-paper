# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (AP → AP-1, AP-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: astro-paper
  key: AP
spec:
  title: "Vercel's AstroPaper template on Cloudflare Workers"
  summary: "AstroPaper — a minimal, accessible Astro blog theme (Markdown and MDX posts with tags, archives and pagination, Pagefind search, an Open Graph image per post rendered at build time, light and dark mode, RSS and a sitemap) — builds fully static and is served as Cloudflare Workers Static Assets behind one small Worker, inside the Cirrus baseline's repository conventions, and becomes an Orun baseline that takes a new blog from nothing to live on stage and prod in one landing."
  state: started
  milestones:
    - name: "AP0 — the spec"
      exitCriteria:
        - "the repository is born with its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [AP-1]
    - name: "AP1 — the blog on Workers"
      exitCriteria:
        - "apps/web is the upstream theme, built static with its Pagefind index and Open Graph images, with one Worker in front of dist/ as Workers Static Assets"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green"
        - "`wrangler dev` serves every page, post, tag page, image, feed and sitemap, the search index, directory URLs and the site's own 404"
        - "the README says how to run, test, preview and deploy it, and how every Vercel piece maps to Cloudflare"
      tasks: [AP-2]
    - name: "AP2 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new blog from nothing to live on stage and prod in one landing, then record it"
        - "a site built from it carries the site only, renamed throughout to its own name, repository and Worker, with the theme's credit intact"
        - "Baseline CI is green: contract tests, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier"
      tasks: [AP-3]
