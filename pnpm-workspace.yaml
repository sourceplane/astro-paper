packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
  - "tooling/*"

# pnpm 10 blocks dependency build scripts unless allow-listed; wrangler's
# workerd and esbuild need theirs to verify their platform binaries, and
# sharp (which renders the Open Graph images at build time) its native one.
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp

